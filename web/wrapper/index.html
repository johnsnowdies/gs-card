<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS-CARD</title>
    <link rel="stylesheet" href="js-dos/js-dos.css">
    <script src="js-dos/js-dos.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        #dos {
            height: 100vh;
            width: auto;
            aspect-ratio: 4 / 3;
            max-width: 100vw;
            overflow: hidden;
            animation: flicker 0.2s infinite alternate;
            z-index: 1;
            background: #000;
            position: relative;
        }

        #dos::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15) 0px,
                rgba(0,0,0,0.15) 2px,
                transparent 2px,
                transparent 4px
            );
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.96; }
            100% { opacity: 1; }
        }

        #dos.no-flicker {
            animation: none;
        }

        #dos.no-scanlines::after {
            background: none;
        }

        /* ----- Блок управления (чекбоксы) ----- */
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: #000;
            padding: 8px 12px;
            color: red;
            font-family: monospace;
            font-size: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
            user-select: none;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .controls input[type="checkbox"] {
            accent-color: red;
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
        }

        /* ----- Блок предупреждения и кнопки сохранения (под чекбоксами) ----- */
        .save-area {
            position: fixed;
            top: 58px;        /* отступ под .controls */
            left: 10px;
            z-index: 100;
            background: #000;
            padding: 10px 14px;
            color: #ff4444;
            font-family: monospace;
            font-size: 13px;
            max-width: 260px;
            border-right: 3px solid #ff0000;
            user-select: none;
        }

        .save-area .warning {
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .save-area .warning strong {
            color: #ff0000;
        }

        .btn-save {
            display: inline-block;
            padding: 6px 16px;
            border: 2px solid #ff0000;
            background: #000;
            color: #ff0000;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn-save:hover {
            background: #ff0000;
            color: #000;
        }

        /* ----- Кнопка "Полный экран" (правый верхний угол) ----- */
        .btn-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 200;
            padding: 6px 14px;
            border: 2px solid #ff0000;
            background: #000;
            color: #ff0000;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .btn-fullscreen:hover {
            background: #ff0000;
            color: #000;
        }

        /* ----- Сообщение для мобильных устройств ----- */
        .mobile-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #ff0000;
            font-family: monospace;
            font-size: 24px;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
        }
        .mobile-message.show {
            display: flex;
        }
        .mobile-message .sub {
            font-size: 16px;
            margin-top: 20px;
            color: #ff6666;
        }
    </style>
</head>
<body>
    <!-- Сообщение для мобильных -->
    <div class="mobile-message" id="mobileMessage">
        <div id="mobileTitle"></div>
        <div class="sub" id="mobileSub"></div>
    </div>

    <div id="dos"></div>

    <!-- Чекбоксы -->
    <div class="controls">
        <label>
            <input type="checkbox" id="toggleFlicker" checked>
            <span id="labelFlicker"></span>
        </label>
        <label>
            <input type="checkbox" id="toggleScanlines" checked>
            <span id="labelScanlines"></span>
        </label>
    </div>

    <!-- Предупреждение + кнопка сохранения -->
    <div class="save-area">
        <div class="warning" id="warningText"></div>
        <button class="btn-save" id="saveEmulatorBtn"></button>
    </div>

    <!-- Кнопка полного экрана -->
    <button class="btn-fullscreen" id="fullscreenBtn"></button>

    <script>
        // --- Определяем мобильное устройство ---
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet|Silk/i.test(navigator.userAgent);
        }

        // --- Парсим язык ---
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang') || 'en';
        if (lang !== 'ru') lang = 'en';

        // --- Локализация ---
        const translations = {
            ru: {
                flicker: "Мерцание",
                scanlines: "Чрезстрочность",
                warning: "Внимание! Для сохранения прогресса после сохранения в игре нажмите",
                saveBtn: "СОХРАНИТЬ ЭМУЛЯТОР",
                fullscreen: "Полный экран",
                mobileTitle: "Эмулятор работает только на компьютере",
                mobileSub: "Пожалуйста, откройте эту страницу с ПК.",
            },
            en: {
                flicker: "Flicker",
                scanlines: "Scanlines",
                warning: "Warning! To save progress after saving in the game, click",
                saveBtn: "SAVE EMULATOR STATE",
                fullscreen: "Fullscreen",
                mobileTitle: "Emulator works only on desktop",
                mobileSub: "Please open this page on a PC.",
            }
        };
        const texts = translations[lang] || translations.en;

        // --- Если мобильное устройство, показываем сообщение и выходим ---
        if (isMobile()) {
            const msg = document.getElementById('mobileMessage');
            msg.classList.add('show');
            document.getElementById('mobileTitle').innerText = texts.mobileTitle;
            document.getElementById('mobileSub').innerText = texts.mobileSub;
            document.getElementById('dos').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
            document.querySelector('.save-area').style.display = 'none';
            document.getElementById('fullscreenBtn').style.display = 'none';
            throw new Error('Mobile device detected – emulator disabled');
        }

        // --- Загружаем манифест, чтобы получить имя бандла ---
        async function initEmulator() {
            try {
                const manifestUrl = '/wrapper/bundles/manifest.json';
                const response = await fetch(manifestUrl, { cache: 'no-store' }); // чтобы всегда получать свежий
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const manifest = await response.json();
                const bundleFile = manifest[lang];
                if (!bundleFile) {
                    throw new Error(`No bundle for language "${lang}" in manifest`);
                }
                const bundlePath = `bundles/${bundleFile}`;

                // --- Запускаем эмулятор с полученным путём ---
                const dosElement = document.getElementById('dos');
                const dosInstance = Dos(dosElement, {
                    url: bundlePath,
                    backend: "dosboxX",
                    backendLocked: true,
                    autoStart: true,
                    kiosk: true,
                    autoSave: true,
                    imageRendering: "smooth",
                    fsChanges: {
                        local: true,
                        urlToKey: async (url) => {
                            return `gs-card-${lang}`;
                        },
                    }
                });

                // Заполняем тексты (для десктопа)
                document.getElementById('labelFlicker').innerText = texts.flicker;
                document.getElementById('labelScanlines').innerText = texts.scanlines;
                document.getElementById('warningText').innerHTML = 
                    `${texts.warning} <strong>${texts.saveBtn}</strong>`;
                document.getElementById('saveEmulatorBtn').innerText = texts.saveBtn;
                document.getElementById('fullscreenBtn').innerText = texts.fullscreen;

                // --- Управление эффектами ---
                const dosEl = document.getElementById('dos');
                const flickerCheck = document.getElementById('toggleFlicker');
                const scanlinesCheck = document.getElementById('toggleScanlines');

                flickerCheck.addEventListener('change', function() {
                    dosEl.classList.toggle('no-flicker', !this.checked);
                });

                scanlinesCheck.addEventListener('change', function() {
                    dosEl.classList.toggle('no-scanlines', !this.checked);
                });

                // --- Кнопка сохранения эмулятора ---
                document.getElementById('saveEmulatorBtn').addEventListener('click', function() {
                    dosInstance.save();
                    const savedText = lang === 'ru' ? 'СДЕЛАНО' : 'DONE';
                    const original = this.innerText;
                    this.innerText = savedText;
                    setTimeout(() => {
                        this.innerText = original;
                    }, 2000);
                });

                // --- Кнопка полного экрана ---
                document.getElementById('fullscreenBtn').addEventListener('click', function() {
                    dosInstance.setFullScreen(true);
                });

            } catch (error) {
                console.error('Failed to load manifest or initialize emulator:', error);
                // Показываем ошибку пользователю
                alert('Ошибка загрузки конфигурации. Пожалуйста, обновите страницу или попробуйте позже.');
            }
        }

        // Запускаем инициализацию
        initEmulator();
    </script>
</body>
</html>
