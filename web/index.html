<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS-CARD</title>
    <link rel="stylesheet" href="/js-dos/js-dos.css">
    <script src="/js-dos/js-dos.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }

        #dos {
            height: 100vh;
            width: auto;
            aspect-ratio: 4 / 3;
            max-width: 100vw;
            overflow: hidden;
            animation: flicker 0.2s infinite alternate;
            z-index: 1;
            background: #000;
            position: relative;
        }

        #dos::after {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15) 0px,
                rgba(0,0,0,0.15) 2px,
                transparent 2px,
                transparent 4px
            );
            box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.96; }
            100% { opacity: 1; }
        }

        #dos.no-flicker {
            animation: none;
        }

        #dos.no-scanlines::after {
            background: none;
        }

        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: #000;
            padding: 8px 12px;
            color: red;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            gap: 16px;
            align-items: center;
            user-select: none;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .controls input[type="checkbox"] {
            accent-color: red;
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="dos"></div>

    <div class="controls">
        <label>
            <input type="checkbox" id="toggleFlicker" checked>
            <span id="labelFlicker"></span>
        </label>
        <label>
            <input type="checkbox" id="toggleScanlines" checked>
            <span id="labelScanlines"></span>
        </label>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let lang = urlParams.get('lang') || 'en';
        if (lang !== 'ru') lang = 'en';

        const bundlePath = `bundles/bundle-${lang}.jsdos`;

        Dos(document.getElementById("dos"), {
            url: bundlePath,
            backend: "dosboxX",
            backendLocked: true,
            autoStart: true,
            kiosk: true,
            imageRendering: "smooth",
        });

        const translations = {
            ru: {
                flicker: "Мерцание",
                scanlines: "Чрезстрочность"
            },
            en: {
                flicker: "Flicker",
                scanlines: "Scanlines"
            }
        };
        const texts = translations[lang] || translations.en;
        document.getElementById('labelFlicker').innerText = texts.flicker;
        document.getElementById('labelScanlines').innerText = texts.scanlines;

        const dosEl = document.getElementById('dos');
        const flickerCheck = document.getElementById('toggleFlicker');
        const scanlinesCheck = document.getElementById('toggleScanlines');

        flickerCheck.addEventListener('change', function() {
            dosEl.classList.toggle('no-flicker', !this.checked);
        });

        scanlinesCheck.addEventListener('change', function() {
            dosEl.classList.toggle('no-scanlines', !this.checked);
        });
    </script>
</body>
</html>
