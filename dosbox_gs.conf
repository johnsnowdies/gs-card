# This is a configuration file for DOSBox 0.74-3
# GS-CARD project — compilation and run
#
# __MOUNT_PATH__ is replaced by run.sh with the actual project root

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=original
output=surface
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper-0.74-3.map
usescancodes=true

[dosbox]
machine=svga_s3
captures=capture
memsize=16

[render]
frameskip=0
aspect=false
monochrome=false
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=500
cycledown=20

[mixer]
nosound=false
rate=22050
blocksize=2048
prebuffer=10

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=22050

[gus]
gus=false
gusrate=22050
guskb=1
gusirq=5
gusdma=3
gusultraport=240
gusmidi=false

[speaker]
pcspeaker=false
pcrate=22050
tandy=auto
tandyrate=22050
disney=false

[joystick]
joysticktype=auto
timed=false
autofire=false
swap34=false
buttonwrap=false

[serial]
serial1=dummy
serial2=dummy
serial3=dummy
serial4=dummy

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[autoexec]
mount C: __MOUNT_PATH__
c:
cd src
COMPILE.BAT
